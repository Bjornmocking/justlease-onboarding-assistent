<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Beheer: onbeantwoorde vragen</title>
  <link rel="icon" href="assets/logo.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-bar { display: flex; gap: 8px; margin: 16px 0 24px; max-width: 520px; }
    .admin-bar input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--blue); border-radius: 4px; font: inherit; }
    .admin-note { color: var(--muted); margin-bottom: 16px; }
    .unanswered { border-bottom: 1px solid var(--border); padding: 14px 0; }
    .unanswered-q { font-family: "Oswald", Arial, sans-serif; font-weight: 500; font-size: 1.1rem; color: var(--blue); }
    .unanswered-meta { font-size: 0.9rem; color: var(--muted); margin: 2px 0 8px; }
    .unanswered-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-small { padding: 8px 14px; font-size: 0.9rem; }
    .btn-small::after { display: none; }
    .btn-small.secondary { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
    .admin-error { color: var(--red); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/"><img src="assets/logo.png" alt="Justlease Private Lease" /></a>
    </div>
  </header>

  <main class="page">
    <h1>Onbeantwoorde vragen<span class="dot">.</span></h1>
    <p class="lead">
      Vragen waarop de assistent het antwoord niet wist. Voeg het antwoord toe aan de kennisbank
      (bijvoorbeeld in <code>data/werkwijze.md</code>), zodat de assistent het de volgende keer wel weet,
      en verwijder de vraag hier daarna.
    </p>

    <form class="admin-bar" id="admin-form">
      <input type="password" id="admin-token" placeholder="Beheercode" autocomplete="off" required />
      <button type="submit" class="btn">Laden</button>
    </form>
    <div id="admin-status" class="admin-note"></div>
    <div id="admin-list"></div>
  </main>

  <script>
    const form = document.getElementById('admin-form');
    const tokenInput = document.getElementById('admin-token');
    const statusEl = document.getElementById('admin-status');
    const listEl = document.getElementById('admin-list');
    let token = '';

    const REASONS = { 'geen-bron': 'Niets gevonden in de documenten', twijfel: 'Assistent twijfelde', onjuist: 'Gemeld als onjuist antwoord' };

    function normalize(q) {
      return q.toLowerCase().replace(/[^a-z0-9à-ÿ ]+/g, '').replace(/\s+/g, ' ').trim();
    }

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = isError ? 'admin-note admin-error' : 'admin-note';
    }

    async function api(method, query) {
      const response = await fetch('/api/onbeantwoord' + (query || ''), {
        method,
        headers: { Authorization: 'Bearer ' + token },
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Er ging iets mis.');
      return data;
    }

    function render(items) {
      listEl.innerHTML = '';
      const groups = new Map();
      items.forEach((item) => {
        const key = normalize(item.question);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      });
      const sorted = [...groups.values()].sort((a, b) => b.length - a.length || (b[0].time > a[0].time ? 1 : -1));
      if (sorted.length === 0) {
        listEl.textContent = 'Geen onbeantwoorde vragen.';
        return;
      }
      sorted.forEach((group) => {
        const first = group[0];
        const row = document.createElement('div');
        row.className = 'unanswered';

        const q = document.createElement('div');
        q.className = 'unanswered-q';
        q.textContent = first.question;

        const meta = document.createElement('div');
        meta.className = 'unanswered-meta';
        const date = new Date(first.time).toLocaleString('nl-NL');
        meta.textContent = `${group.length}x gesteld, laatst op ${date}. ${REASONS[first.reason] || first.reason}.`;

        const actions = document.createElement('div');
        actions.className = 'unanswered-actions';

        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'btn btn-small secondary';
        copy.textContent = 'Kopieer sjabloon';
        copy.addEventListener('click', async () => {
          const text = `## ${first.question}\nAntwoord: \n`;
          try {
            await navigator.clipboard.writeText(text);
            copy.textContent = 'Gekopieerd';
          } catch (err) {
            window.prompt('Kopieer dit sjabloon:', text);
          }
        });

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'btn btn-small';
        remove.textContent = 'Verwijder (beantwoord)';
        remove.addEventListener('click', async () => {
          remove.disabled = true;
          try {
            for (const item of group) await api('DELETE', '?id=' + encodeURIComponent(item.id));
            row.remove();
          } catch (err) {
            setStatus(err.message, true);
            remove.disabled = false;
          }
        });

        actions.append(copy, remove);
        row.append(q, meta, actions);
        listEl.appendChild(row);
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      token = tokenInput.value.trim();
      setStatus('Bezig met laden...');
      try {
        const data = await api('GET');
        setStatus(data.note || '');
        render(data.items || []);
      } catch (err) {
        listEl.innerHTML = '';
        setStatus(err.message, true);
      }
    });
  </script>
</body>
</html>
